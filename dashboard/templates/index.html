<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>东软充电桩 — 智能分析大屏</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script>
    // 本页是 Vue 构建产物不存在时的兜底页，ECharts 走 CDN，仓库内没有本地副本。
    // 离线环境下 CDN 静默失败，8 张图全白且没有任何提示，极易被误判成"没有数据"。
    // 这里兜一个 stub + 可见横幅：KPI 卡片等 DOM 部分照常渲染，只有图表区空着。
    if (!window.echarts) {
      window.echarts = {
        init: function () { return { setOption: function () {}, resize: function () {} }; }
      };
      document.addEventListener('DOMContentLoaded', function () {
        var tip = document.createElement('div');
        tip.style.cssText = 'margin:16px 28px;padding:14px 18px;border:1px solid #7c2d12;'
          + 'background:#2a1207;color:#fdba74;border-radius:8px;font-size:14px;line-height:1.8';
        tip.innerHTML = '<b>ECharts 未加载</b>：本页图表依赖 CDN（echarts@5.5.1），'
          + '当前环境访问不了 cdn.jsdelivr.net，所以图表区是空白的（数据本身正常）。<br>'
          + '离线部署请改用 Vue 版：<code>cd dashboard-web &amp;&amp; npm install &amp;&amp; npm run build</code>'
          + '（ECharts 会打包进 static/dist），或把 echarts.min.js 放进 dashboard/static/ 再改本页的 script 地址。';
        document.body.insertBefore(tip, document.body.firstChild);
      });
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b1220;
      color: #e8eef7;
      min-height: 100vh;
    }
    header {
      padding: 20px 28px 12px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 24px; font-weight: 600; }
    header .sub { color: #94a3b8; font-size: 13px; margin-top: 4px; }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      padding: 18px 28px;
    }
    .kpi {
      background: linear-gradient(145deg, #111827, #0f172a);
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px 18px;
    }
    .kpi .label { color: #94a3b8; font-size: 13px; }
    .kpi .value { font-size: 26px; font-weight: 700; margin-top: 8px; color: #38bdf8; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 0 28px 28px;
    }
    .panel {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      min-height: 340px;
    }
    .panel.full { grid-column: 1 / -1; min-height: 380px; }
    .panel h2 {
      font-size: 15px;
      color: #cbd5e1;
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .chart { width: 100%; height: 300px; }
    .chart.tall { height: 340px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>东软电动汽车充电桩 — 智能分析大屏</h1>
    </div>
    <div class="sub" id="updatedAt">加载中...</div>
  </header>

  <section class="kpi-row" id="kpiRow"></section>

  <section class="grid">
    <div class="panel"><h2>近 30 日营收趋势</h2><div id="revenueChart" class="chart"></div></div>
    <div class="panel"><h2>电桩状态分布</h2><div id="pileChart" class="chart"></div></div>
    <div class="panel"><h2>充电高峰曲线（平台 × 小时）</h2><div id="hourlyChart" class="chart"></div></div>
    <div class="panel"><h2>电站排行（最近一日营收）</h2><div id="rankChart" class="chart"></div></div>
    <div class="panel"><h2>近30天 24小时历史充电量分布</h2><div id="historyHourChart" class="chart"></div></div>
    <div class="panel"><h2>工作日 vs 周末充电对比</h2><div id="weekdayChart" class="chart"></div></div>
    <div class="panel full"><h2>各站负荷预测（1h / 6h / 24h，含天气/节假日修正）</h2><div id="loadChart" class="chart tall"></div></div>
    <div class="panel full"><h2>充电时长与高峰时段预测</h2><div id="timeChart" class="chart tall"></div></div>
  </section>

  <script>
    function round2(v) {
      if (v == null || v === '') return 0;
      return Math.round(Number(v) * 100) / 100;
    }

    async function fetchJson(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(url + ' failed');
      return resp.json();
    }

    function renderKpi(kpi) {
      const d = kpi.latest_daily || {};
      const cards = [
        ['充电站', kpi.station_count ?? '-'],
        ['电桩总数', kpi.pile_count ?? '-'],
        ['当前空闲桩', kpi.idle_piles ?? '-'],
        ['最近日营收(元)', d.total_revenue != null ? round2(d.total_revenue).toFixed(2) : '-'],
        ['最近日订单', d.order_count ?? '-'],
      ];
      document.getElementById('kpiRow').innerHTML = cards.map(([label, value]) =>
        `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div></div>`
      ).join('');
      document.getElementById('updatedAt').textContent = '刷新时间：' + (kpi.updated_at || '');
    }

    function renderRevenue(data) {
      const chart = echarts.init(document.getElementById('revenueChart'));
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis', valueFormatter: v => round2(v).toFixed(2) + ' 元' },
        grid: { left: 48, right: 20, top: 30, bottom: 30 },
        xAxis: { type: 'category', data: data.map(r => r.stat_date), axisLabel: { color: '#94a3b8' } },
        yAxis: { type: 'value', axisLabel: { color: '#94a3b8', formatter: v => round2(v).toFixed(2) }, splitLine: { lineStyle: { color: '#1f2937' } } },
        series: [{ name: '营收', type: 'line', smooth: true, data: data.map(r => round2(r.total_revenue)), areaStyle: {}, color: '#38bdf8' }]
      });
    }

    function renderPileStatus(data) {
      const chart = echarts.init(document.getElementById('pileChart'));
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'item' },
        legend: { bottom: 0, textStyle: { color: '#cbd5e1' } },
        series: [{
          type: 'pie', radius: ['40%', '68%'],
          data: data.map(r => ({ name: r.status, value: r.cnt })),
          label: { color: '#e2e8f0' }
        }]
      });
    }

    function renderHourly(data) {
      const hours = Array.from({ length: 24 }, (_, i) => i);
      const kwhData = hours.map(h => {
        const row = data.find(r => Number(r.stat_hour) === h);
        return row ? round2(row.kwh) : 0;
      });
      const orderData = hours.map(h => {
        const row = data.find(r => Number(r.stat_hour) === h);
        return row ? Number(row.orders) : 0;
      });
      const chart = echarts.init(document.getElementById('hourlyChart'));
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        legend: { data: ['电量 kWh', '订单数'], textStyle: { color: '#cbd5e1' } },
        grid: { left: 48, right: 20, top: 40, bottom: 30 },
        xAxis: { type: 'category', data: hours.map(h => h + ':00'), axisLabel: { color: '#94a3b8' } },
        yAxis: [
          { type: 'value', name: 'kWh', axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1f2937' } } },
          { type: 'value', name: '单', axisLabel: { color: '#94a3b8' }, splitLine: { show: false } }
        ],
        series: [
          { name: '电量 kWh', type: 'bar', data: kwhData, color: '#22c55e' },
          { name: '订单数', type: 'line', yAxisIndex: 1, data: orderData, color: '#f59e0b' }
        ]
      });
    }

    function renderRank(data) {
      const chart = echarts.init(document.getElementById('rankChart'));
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis', valueFormatter: v => round2(v).toFixed(2) + ' 元' },
        grid: { left: 100, right: 20, top: 20, bottom: 30 },
        xAxis: { type: 'value', axisLabel: { color: '#94a3b8', formatter: v => round2(v).toFixed(2) }, splitLine: { lineStyle: { color: '#1f2937' } } },
        yAxis: { type: 'category', data: data.map(r => r.name).reverse(), axisLabel: { color: '#94a3b8', width: 90, overflow: 'truncate' } },
        series: [{ type: 'bar', data: data.map(r => round2(r.revenue)).reverse(), color: '#818cf8' }]
      });
    }

    function renderLoadForecast(data) {
      const horizons = ['1h', '6h', '24h'];
      const stations = [...new Set(data.map(r => r.station_name))];
      const chart = echarts.init(document.getElementById('loadChart'));
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        legend: { data: horizons, textStyle: { color: '#cbd5e1' } },
        grid: { left: 48, right: 20, top: 40, bottom: 80 },
        xAxis: { type: 'category', data: stations, axisLabel: { color: '#94a3b8', rotate: 20 } },
        yAxis: { type: 'value', name: '预测负荷 kWh', axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1f2937' } } },
        series: horizons.map(h => ({
          name: h,
          type: 'bar',
          data: stations.map(name => {
            const row = data.find(r => r.station_name === name && r.horizon === h);
            return row ? row.predicted_load : 0;
          })
        }))
      });
    }

    function renderHistoryHourly(data) {
      const hours = Array.from({ length: 24 }, (_, i) => i);
      const kwhByHour = hours.map(h => {
        const row = data.find(r => Number(r.stat_hour) === h);
        return row ? Number(row.kwh) : 0;
      });
      const chart = echarts.init(document.getElementById('historyHourChart'));
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        grid: { left: 48, right: 20, top: 30, bottom: 30 },
        xAxis: { type: 'category', data: hours.map(h => h + ':00'), axisLabel: { color: '#94a3b8' } },
        yAxis: { type: 'value', name: 'kWh', axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1f2937' } } },
        series: [{ name: '历史充电量', type: 'bar', data: kwhByHour, color: '#38bdf8' }]
      });
    }

    function renderWeekdayWeekend(data) {
      const chart = echarts.init(document.getElementById('weekdayChart'));
      const labels = data.map(r => r.label || r.day_type);
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        legend: { data: ['电量 kWh', '订单数'], textStyle: { color: '#cbd5e1' } },
        grid: { left: 48, right: 20, top: 40, bottom: 30 },
        xAxis: { type: 'category', data: labels, axisLabel: { color: '#94a3b8' } },
        yAxis: [
          { type: 'value', name: 'kWh', axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1f2937' } } },
          { type: 'value', name: '单', axisLabel: { color: '#94a3b8' }, splitLine: { show: false } }
        ],
        series: [
          { name: '电量 kWh', type: 'bar', data: data.map(r => r.kwh), color: '#6366f1' },
          { name: '订单数', type: 'line', yAxisIndex: 1, data: data.map(r => r.orders), color: '#f97316' }
        ]
      });
    }

    function renderTimeForecast(data) {
      const chart = echarts.init(document.getElementById('timeChart'));
      const items = data.filter(r => r.horizon === '1h');
      chart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        legend: { data: ['预测时长(分)', '高峰小时'], textStyle: { color: '#cbd5e1' } },
        grid: { left: 48, right: 48, top: 40, bottom: 80 },
        xAxis: { type: 'category', data: items.map(r => r.station_name), axisLabel: { color: '#94a3b8', rotate: 20 } },
        yAxis: [
          { type: 'value', name: '分钟', axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1f2937' } } },
          { type: 'value', name: '小时', min: 0, max: 23, axisLabel: { color: '#94a3b8' }, splitLine: { show: false } }
        ],
        series: [
          { name: '预测时长(分)', type: 'bar', data: items.map(r => r.predicted_avg_duration_min), color: '#14b8a6' },
          { name: '高峰小时', type: 'line', yAxisIndex: 1, data: items.map(r => r.predicted_peak_hour ?? 0), color: '#fb7185' }
        ]
      });
    }

    async function loadAll() {
      try {
        const [kpi, revenue, pile, hourly, rank, load, time, historyHour, weekday] = await Promise.all([
          fetchJson('/api/kpi'),
          fetchJson('/api/revenue_trend'),
          fetchJson('/api/pile_status'),
          fetchJson('/api/station_hourly_today'),
          fetchJson('/api/station_rank'),
          fetchJson('/api/load_forecast'),
          fetchJson('/api/time_forecast'),
          fetchJson('/api/hourly_history'),
          fetchJson('/api/weekday_weekend'),
        ]);
        renderKpi(kpi);
        renderRevenue(revenue);
        renderPileStatus(pile);
        renderHourly(hourly);
        renderRank(rank);
        renderHistoryHourly(historyHour);
        renderWeekdayWeekend(weekday);
        renderLoadForecast(load);
        renderTimeForecast(time);
      } catch (e) {
        document.getElementById('updatedAt').textContent = '加载失败：' + e.message;
      }
    }

    loadAll();
    setInterval(loadAll, 60000);
  </script>
</body>
</html>
